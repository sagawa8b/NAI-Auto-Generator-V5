name: Release

# 릴리스를 내는 길은 두 가지다.
#   1) v* 태그를 민다 — 평소 방식.
#   2) Actions에서 이 워크플로를 실행하며 release_tag에 태그를 적는다.
#      로컬 클론 없이 웹에서 릴리스를 낼 때 쓴다. 태그는 이 실행의 커밋에 새로 달린다.
# release_tag를 비우고 실행하면 릴리스 없이 산출물만 올린다 (시험 빌드).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "릴리스를 만들 태그 (예: v0.2.0). 비우면 시험 빌드만 합니다."
        required: false
        default: ""

permissions:
  contents: write # Release 생성

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install .
          pip install pyinstaller

      # 어긋난 릴리스를 막는다 — 태그와 코드의 버전이 다르면 여기서 멈춘다.
      - name: 버전 확인 (태그 == naiauto.__version__)
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(python -c "import naiauto; print(naiauto.__version__)")
          echo "version=$version" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG}"
          fi

          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::태그 $tag 와 __version__ $version 이 다릅니다"
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_ENV"

      - name: 빌드
        run: pyinstaller --noconfirm packaging/nai-auto-v5.spec

      # 검증은 콘솔 모드 실행 파일로 한다. GUI 서브시스템(console=False) exe는
      # sys.stdout이 없어 print가 사라지고 셸이 종료를 기다리지 못해, 출력도 종료
      # 코드도 얻지 못한 채 멈췄다 (러너에서 3분 타임아웃으로 확인). spec이 같은
      # 번들을 가리키는 콘솔 exe를 함께 만들고, 검증 후 압축 전에 지운다.
      - name: 셀프테스트 (리소스 · keyring 백엔드 · WD14)
        shell: bash
        timeout-minutes: 3
        run: |
          # 실패해도 출력을 반드시 남긴다. `set -e` 아래에서 `output=$(...)`가 실패하면
          # 그 자리에서 셸이 끝나 뒤따르는 echo가 실행되지 않았고, 로그에는 "exit code 1"만
          # 남아 무엇이 빠졌는지 알 수 없었다 (v0.6.7 릴리스 시도에서 겪음).
          set +e
          output=$(./dist/NAI-Auto-V5/NAI-Auto-V5-selftest.exe --selftest 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::error::셀프테스트 실패 (종료 코드 $status) — 위 selftest FAIL 줄이 원인이다"
            exit 1
          fi
          grep -q "selftest OK" <<<"$output"

      # 창을 실제로 세워 본다. --selftest는 리소스만 보므로, 시작하다 죽는 실수를
      # 잡지 못했다 (v0.2.1이 프로퍼티를 함수처럼 불러 뜨자마자 죽은 채 릴리스됐다).
      - name: 스모크테스트 (창 생성 · 옵션 창)
        shell: bash
        timeout-minutes: 3
        run: |
          set +e
          output=$(./dist/NAI-Auto-V5/NAI-Auto-V5-selftest.exe --smoketest 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::error::스모크테스트 실패 (종료 코드 $status) — 위 smoketest FAIL 줄이 원인이다"
            exit 1
          fi
          grep -q "smoketest OK" <<<"$output"

      - name: 셀프테스트 실행 파일 제거 (배포본에는 넣지 않는다)
        shell: bash
        run: rm -f "dist/NAI-Auto-V5/NAI-Auto-V5-selftest.exe"

      # 두 가지를 낸다: 폴더형 zip(빠른 실행)과 단일 exe(받아서 바로 실행).
      - name: 압축
        shell: bash
        run: |
          name="NAI-Auto-V5-v${version}-windows"
          [ -n "${release_tag}" ] || name="NAI-Auto-V5-${GITHUB_SHA::7}-windows"
          echo "zip_name=$name" >> "$GITHUB_ENV"
          echo "onefile_name=$name-onefile.exe" >> "$GITHUB_ENV"
          7z a -tzip "$name.zip" ./dist/NAI-Auto-V5/*
          mv "dist/NAI-Auto-V5-onefile.exe" "$name-onefile.exe"
          ls -lh "$name.zip" "$name-onefile.exe"

      - name: 아티팩트 업로드 (시험 빌드)
        if: env.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name }}
          path: |
            ${{ env.zip_name }}.zip
            ${{ env.onefile_name }}

      # 태그가 아직 없으면 이 커밋에 새로 단다 (dispatch 경로).
      # 릴리스 본문 = PATCHNOTES.md의 해당 버전 절 + 설치 안내.
      # 절이 없으면 여기서 실패한다 — 패치 노트 없는 릴리스는 내지 않는다.
      # 시험 빌드에서도 돌린다 (릴리스에 쓰이진 않는다). 이 단계가 러너에서 실제로
      # 동작하는지 릴리스를 내지 않고 확인하기 위해서다.
      - name: 릴리스 본문 만들기
        shell: bash
        run: |
          python tools/patchnotes.py "${release_tag:-v$version}" > notes.md

          {
            echo "## 변경 사항"
            echo
            cat notes.md
            echo
            echo "## 설치"
            echo
            echo "Python 설치는 필요 없습니다. 둘 중 편한 쪽을 받으세요."
            echo
            echo "| 파일 | 설명 |"
            echo "|---|---|"
            echo "| \`${zip_name}.zip\` | **권장.** 압축을 풀고 \`NAI-Auto-V5.exe\` 실행. 시작이 빠릅니다. 함께 나오는 \`_internal\` 폴더는 프로그램 파일이니 지우지 마세요. |"
            echo "| \`${onefile_name}\` | 받아서 바로 실행. 대신 실행할 때마다 내용을 임시 폴더에 풀어 **시작이 5~10초 걸립니다.** |"
            echo
            echo "서명하지 않은 실행 파일이라 처음 실행할 때 Windows SmartScreen 경고가 뜹니다 — \`추가 정보\` → \`실행\`을 누르면 됩니다."
          } > release_body.md

          cat release_body.md

      - name: 릴리스 생성
        if: env.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          files: |
            ${{ env.zip_name }}.zip
            ${{ env.onefile_name }}
          generate_release_notes: true
          body_path: release_body.md

name: Release

# 릴리스를 내는 길은 두 가지다.
#   1) v* 태그를 민다 — 평소 방식.
#   2) Actions에서 이 워크플로를 실행하며 release_tag에 태그를 적는다.
#      로컬 클론 없이 웹에서 릴리스를 낼 때 쓴다. 태그는 이 실행의 커밋에 새로 달린다.
# release_tag를 비우고 실행하면 릴리스 없이 산출물만 올린다 (시험 빌드).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "릴리스를 만들 태그 (예: v0.2.0). 비우면 시험 빌드만 합니다."
        required: false
        default: ""

permissions:
  contents: write # Release 생성

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install .
          pip install pyinstaller

      # 어긋난 릴리스를 막는다 — 태그와 코드의 버전이 다르면 여기서 멈춘다.
      - name: 버전 확인 (태그 == naiauto.__version__)
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(python -c "import naiauto; print(naiauto.__version__)")
          echo "version=$version" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG}"
          fi

          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::태그 $tag 와 __version__ $version 이 다릅니다"
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_ENV"

      - name: 빌드
        run: pyinstaller --noconfirm packaging/nai-auto-v5.spec

      # 검증은 콘솔 모드 실행 파일로 한다. GUI 서브시스템(console=False) exe는
      # sys.stdout이 없어 print가 사라지고 셸이 종료를 기다리지 못해, 출력도 종료
      # 코드도 얻지 못한 채 멈췄다 (러너에서 3분 타임아웃으로 확인). spec이 같은
      # 번들을 가리키는 콘솔 exe를 함께 만들고, 검증 후 압축 전에 지운다.
      - name: 셀프테스트 (리소스 · keyring 백엔드)
        shell: bash
        timeout-minutes: 3
        run: |
          output=$(./dist/NAI-Auto-V5/NAI-Auto-V5-selftest.exe --selftest)
          echo "$output"
          grep -q "selftest OK" <<<"$output"

      - name: 셀프테스트 실행 파일 제거 (배포본에는 넣지 않는다)
        shell: bash
        run: rm -f "dist/NAI-Auto-V5/NAI-Auto-V5-selftest.exe"

      - name: 압축
        shell: bash
        run: |
          name="NAI-Auto-V5-v${version}-windows"
          [ -n "${release_tag}" ] || name="NAI-Auto-V5-${GITHUB_SHA::7}-windows"
          echo "zip_name=$name" >> "$GITHUB_ENV"
          7z a -tzip "$name.zip" ./dist/NAI-Auto-V5/*
          ls -lh "$name.zip"

      - name: 아티팩트 업로드 (시험 빌드)
        if: env.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name }}
          path: ${{ env.zip_name }}.zip

      # 태그가 아직 없으면 이 커밋에 새로 단다 (dispatch 경로).
      - name: 릴리스 생성
        if: env.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          files: ${{ env.zip_name }}.zip
          generate_release_notes: true
          body: |
            ## 설치

            아래 zip을 내려받아 압축을 풀고 `NAI-Auto-V5.exe`를 실행하세요. Python 설치는 필요 없습니다.

            서명하지 않은 실행 파일이라 처음 실행할 때 Windows SmartScreen 경고가 뜹니다 —
            `추가 정보` → `실행`을 누르면 됩니다.
